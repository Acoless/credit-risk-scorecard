
# Fija la paleta clara y sobria con independencia de la configuracion
# personal de Streamlit en la maquina donde se ejecute la aplicacion.

[theme]
base                = "light"
primaryColor        = "#16233A"
backgroundColor     = "#F1F3F6"
secondaryBackgroundColor = "#FFFFFF"
textColor           = "#101720"
font                = "sans serif"

[client]
toolbarMode = "minimal"

[server]
runOnSave = true
